name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag is on main
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::Tag $GITHUB_REF_NAME is not an ancestor of main"; exit 1; }

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Extract version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify version matches package.json
        shell: bash
        run: |
          PKG_VERSION="$(sed -nE 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' package.json | head -n1)"
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ -z "$PKG_VERSION" ]; then
            echo "::error::Não foi possível ler a versão de package.json"
            exit 1
          fi
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json ($PKG_VERSION) divergente da tag ($TAG_VERSION). Ajuste a versão antes de taggear."
            exit 1
          fi
          echo "Versão $TAG_VERSION confirmada."

      - name: Package
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release
          cp -r dist dist-server drizzle release/
          cp Dockerfile release/
          cp docker-compose.yml release/
          cp .env.example release/
          cp scripts/install-docker.sh release/install-docker.sh
          cp scripts/install-systemd.sh release/install-systemd.sh
          chmod +x release/install-docker.sh release/install-systemd.sh

          tar -czf "diegesis-room-${VERSION}.tar.gz" -C release .
          cp "diegesis-room-${VERSION}.tar.gz" "diegesis-room.tar.gz"
          sha256sum "diegesis-room-${VERSION}.tar.gz" > SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            diegesis-room-${{ steps.version.outputs.version }}.tar.gz
            diegesis-room.tar.gz
            SHA256SUMS.txt
            scripts/install-docker.sh
            scripts/install-systemd.sh
